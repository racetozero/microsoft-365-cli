name: Feature request
description: A command, flag or SDK method that is missing
labels: [enhancement]
body:
  - type: textarea
    id: task
    attributes:
      label: What do you want to do
      description: The task, and the command you would like to type for it.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: For example with `atl api ...`, the web UI, or another tool.

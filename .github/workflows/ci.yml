name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-nextest
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo nextest run --workspace --profile ci
      - name: Documentation tests
        run: cargo test --workspace --doc
      - name: Smoke test
        run: |
          cargo build -p m365
          home="$(mktemp -d)"
          HOME="$home" target/debug/m365 version --agent | grep -q '"ok":true'
          HOME="$home" target/debug/m365 entra user get --agent | grep -q '"code":"input_required"'
          HOME="$home" target/debug/m365 skill --list --agent | grep -q '"name":"m365-spo"'

  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-nextest
      - name: Clippy on Windows
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test on Windows
        run: cargo nextest run --workspace --profile ci

  pgo-scripts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Test PGO helpers
        run: python scripts/test_pgo.py

  installers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check shell installer
        if: runner.os != 'Windows'
        run: |
          bash -n install.sh
          sh tests/installer_regression.sh
      - name: Check shell scripts with ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck -x install.sh tests/installer_regression.sh scripts/release.sh
      - name: Check PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/installer_regression.ps1
